name: chunkspoke_flutter
description: "Think in chunks. Speak in English."
publish_to: 'none'
version: 1.5.6+2057

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  sqflite: ^2.4.1
  flutter_tts: ^4.0.2
  http: ^1.2.0
  vosk_flutter: ^0.3.48
  path_provider: ^2.1.1
  path: ^1.9.0
  permission_handler: ^11.3.0
  crypto: ^3.0.3
  archive: ^3.6.1
  package_info_plus: ^10.2.2
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  url_launcher: ^6.2.5
  sherpa_onnx: 1.13.8
  just_audio: 0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  test: ^1.24.0
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  sqflite_common_ffi: ^2.3.2

# vosk_flutter(0.3.48) 声明较旧的 http/permission_handler 约束；本项目已验证
# http^1.2.0 / permission_handler^11.3.0 可正常工作，此处强制统一版本，避免降级
# 引发其余依赖冲突。仅 Vosk 离线识别使用本插件，模型已随包内置（不触发其下载路径）。
dependency_overrides:
  http: ^1.2.0
  permission_handler: ^11.3.0
  sqflite_common_ffi: ^2.4.4
  # 3.7.1 的 Android 预编译资产需从 GitHub Releases 拉取，离线/受限网络构建失败；
  # 3.5.2 为 1.4.9 构建期实际使用版本，本地缓存齐全，仅测试用 FFI 依赖。
  sqlite3: 3.5.2

flutter:
  uses-material-design: true
  assets:
    - assets/content_pack.json
    - assets/listening_articles.json
    - assets/version.json
    - assets/legal/LICENSE-GPLv3.txt
    - assets/legal/SOURCE-OFFER.txt
    - assets/legal/VOICE-PACK-NOTICE.txt
    - assets/icon/icon.png
    - assets/icon/icon_foreground.png

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0F0F1A"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  android: true
  ios: false
  min_sdk_android: 21
